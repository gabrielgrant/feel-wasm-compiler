[workspace]
resolver = "2"
members = [
    "crates/feel-decimal",
    "crates/feel-temporal",
    "crates/feel-runtime",
    "crates/feel-runtime-wasm",
    "crates/feel-compiler",
    "crates/feel-host",
    "crates/feel-cli",
    "crates/feel-web",
    "crates/feel-dmn",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/gabrielgrant/feel-wasm-compiler"

[workspace.dependencies]
feel-decimal = { path = "crates/feel-decimal" }
feel-temporal = { path = "crates/feel-temporal" }
feel-runtime = { path = "crates/feel-runtime" }
feel-compiler = { path = "crates/feel-compiler" }
feel-host = { path = "crates/feel-host" }
feel-dmn = { path = "crates/feel-dmn" }
wasm-encoder = "=0.263.0"
wasmparser = "=0.263.0"
wasmi = "=2.0.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
roxmltree = "=0.21.2"
fancy-regex = { version = "=0.20.0", default-features = false, features = ["unicode", "perf"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "=0.11.1"
clap = { version = "=4.6.7", features = ["derive"] }

[workspace.lints.clippy]
# options structs are routinely built from `Default` and then adjusted
field_reassign_with_default = "allow"

[profile.release]
opt-level = 3
# LTO is enabled for the Wasm artifacts (profile `wasm`) only: rustdoc
# doctests linked against LTO-built rlibs crash with this toolchain
# (reproducible with `CARGO_PROFILE_RELEASE_LTO=true cargo test --release --doc -p feel-host`).
lto = false
codegen-units = 1


# Size-optimised profile for the browser artifacts (compiler.wasm, runtime.wasm)
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
strip = true
panic = "abort"
